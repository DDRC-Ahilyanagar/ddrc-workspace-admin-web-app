  name: Deploy to VPS

  on:
    push:
      branches: [ main, master ]

  jobs:
    deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Clean install workspace dependencies
          run: |
            rm -rf node_modules package-lock.json ~/.npm
            npm install

        - name: Build
          run: npm run build

        - name: Test Server Connectivity
          run: |
            echo "Testing connection to ${{ secrets.VPS_HOST }}:${VPS_PORT:-22}"
            timeout 10 bash -c "echo > /dev/tcp/${{ secrets.VPS_HOST }}/${VPS_PORT:-22}" 2>/dev/null && echo "Port is open" || echo "Port is closed or unreachable"
          continue-on-error: true

        - name: Upload to Server
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_KEY }}
            port: ${{ secrets.VPS_PORT || 22 }}
            timeout: 300s
            command_timeout: 300s
            debug: true
            source: ".next/**,package.json,package-lock.json,public/**,lib/**,app/**,middleware.ts,next.config.mjs,tsconfig.json,storage/**,prisma/**"
            target: "/var/www/surveys"

        - name: Restart PM2
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_KEY }}
            port: ${{ secrets.VPS_PORT || 22 }}
            timeout: 300s
            command_timeout: 300s
            debug: true
            script: |
              cd /var/www/surveys
              rm -rf node_modules package-lock.json ~/.npm
              npm install --production
              # Ensure storage directory exists
              mkdir -p storage/logs
              # Run database seed to update questions/sections
              npm run prisma:seed || echo "Seed script completed (may have skipped if already seeded)"
              # Check PM2 status and restart
              pm2 restart surveys || pm2 start npm --name "surveys" -- start
              pm2 save
