name: Deploy to VPS

on:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build
        env:
          # Optimize Next.js build
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "mysql://user:pass@localhost:3306/db" # Placeholder

      - name: Test Server Connectivity
        run: |
          echo "Testing connection to ${{ secrets.VPS_HOST }}:${VPS_PORT:-22}"
          timeout 10 bash -c "echo > /dev/tcp/${{ secrets.VPS_HOST }}/${VPS_PORT:-22}" 2>/dev/null && echo "Port is open" || echo "Port is closed or unreachable"
        continue-on-error: true

      - name: Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 300s
          command_timeout: 300s
          debug: false
          # Use tar for faster compressed transfer
          tar_tmp_path: /tmp/
          use_insecure_cipher: false
          # Upload only necessary files (exclude source code, only built assets)
          source: ".next,package.json,package-lock.json,public,prisma,next.config.mjs"
          target: "/var/www/surveys.ddrcnagar.in"
          strip_components: 0
          overwrite: true

      - name: Deploy and Restart (Combined)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 600s
          command_timeout: 600s
          debug: true
          script: |
            cd /var/www/surveys.ddrcnagar.in
            
            # Smart dependency installation - only if package-lock.json changed
            if ! cmp -s package-lock.json .package-lock.json.cached 2>/dev/null; then
              echo "📦 Dependencies changed, installing..."
              # Use npm install instead of npm ci for faster incremental updates
              npm install --omit=dev --no-audit --no-fund --prefer-offline
              cp package-lock.json .package-lock.json.cached
            else
              echo "✅ Dependencies unchanged, skipping npm install"
            fi
            
            # Setup storage
            mkdir -p storage/logs
            
            # Seed database (skip if fails)
            npm run prisma:seed || echo "⚠️ Prisma seed skipped"
            
            # Restart PM2 with zero-downtime reload
            export NODE_ENV=production
            export PORT=3000
            if pm2 list | grep -q "surveys-ddrc"; then
              echo "🔄 Reloading PM2 process..."
              pm2 reload surveys-ddrc --update-env
            else
              echo "🚀 Starting new PM2 process..."
              pm2 start npm --name "surveys-ddrc" -- start
            fi
            pm2 save --force
            
            echo "✅ Deployment completed successfully!"
