name: Admin Web App CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Production
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          # UPDATE THIS PATH
          export APP_DIR="/var/www/ddrc-admin"
          
          # Ensure directory exists
          mkdir -p $APP_DIR
          cd $APP_DIR
          
          # Pull latest code
          # If it's a fresh deploy, you might need: git clone git@github.com:utkrranti/ddrc-workspace-admin-web-app.git .
          git pull origin master
          
          # Install dependencies and build
          npm ci
          npm run build
          
          # Restart application (Using PM2)
          # Ensure PM2 is installed globally on the server
          pm2 restart ddrc-admin || pm2 start npm --name "ddrc-admin" -- start
